{% extends "base.html" %}
{% block title %}Create an account · {{ brand.name }}{% endblock %}
{% block content %}
<section aria-labelledby="signup-title">
  <p class="eyebrow">Join {{ brand.name }}</p>
  <h1 id="signup-title">Create your account</h1>
  <p class="lede">Start with a private member space.</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/signup">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="form-stack">
      <label for="signup-username">Username</label>
      <input id="signup-username" name="username" type="text"
             autocomplete="username" required minlength="3" maxlength="32"
             value="{{ username }}">
      <label for="signup-password">Password</label>
      <input id="signup-password" name="password" type="password"
             autocomplete="new-password" required minlength="15" maxlength="128">
      <button class="button" type="submit">Create account</button>
    </div>
  </form>
  <p>Already have an account? <a href="/login">Log in</a>.</p>
</section>
{% endblock %}
