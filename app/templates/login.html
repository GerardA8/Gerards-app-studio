{% extends "base.html" %}
{% block title %}Log in · {{ brand.name }}{% endblock %}
{% block content %}
<section aria-labelledby="login-title">
  <p class="eyebrow">Welcome back</p>
  <h1 id="login-title">Log in</h1>
  {% if notice %}<p class="notice">{{ notice }}</p>{% endif %}
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="form-stack">
      <label for="login-username">Username</label>
      <input id="login-username" name="username" type="text"
             autocomplete="username" required maxlength="32"
             value="{{ username }}">
      <label for="login-password">Password</label>
      <input id="login-password" name="password" type="password"
             autocomplete="current-password" required maxlength="128">
      <button class="button" type="submit">Log in</button>
    </div>
  </form>
  <p>New to {{ brand.name }}? <a href="/signup">Create an account</a>.</p>
</section>
{% endblock %}
